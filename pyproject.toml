[project]
name = "zzk"
version = "1.0.0"
description = "지직 (zzk) - 치지직(치지직) 오픈소스 로컬 웹 방송 다운로더"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pydantic>=2.8",
    "streamlink>=8.4.0",
    "orjson>=3.11.9",
    "python-multipart>=0.0.9",
]

[project.scripts]
zzk = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true
